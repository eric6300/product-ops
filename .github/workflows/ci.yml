name: Validate framework

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate framework files and workflows
        run: ./scripts/validate-framework.sh

      - name: ShellCheck
        run: shellcheck .claude/hooks/guard-repos.sh scripts/validate-framework.sh tests/test-guard-repos.sh
